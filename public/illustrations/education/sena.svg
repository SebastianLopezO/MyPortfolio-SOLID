<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="">
    <style>@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out 3
        both}.rise{animation:rise .9s cubic-bezier(.32,.72,0,1)
        both}.sweep{transform-origin:center;transform-box:fill-box;animation:sweep 2.4s cubic-bezier(.3,0,0,1) 1
        both}}@keyframes pulse{50%{opacity:.25}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes
        sweep{from{transform:rotate(-120deg)}}
    </style>
    <defs>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
            <stop offset="1" stop-color="#000" stop-opacity=".07"/>
        </linearGradient>
        <radialGradient id="glass" cx=".32" cy=".28" r=".75">
            <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
            <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>
    <g class="rise">
        <g>
            <g>
                <g>
                    <rect x="90" y="278" width="220" height="52" rx="10" fill="#0d1120" opacity="0.2"
                          filter="url(#soft)"/>
                    <rect x="84" y="268" width="232" height="52" rx="10" fill="#b34b1f"/>
                    <rect x="84" y="252" width="232" height="52" rx="10" fill="#ff6b2c"/>
                    <rect x="84" y="252" width="232" height="52" rx="10" fill="url(#sheen)"/>
                    <rect x="85" y="253" width="230" height="50" rx="9" fill="none" stroke="#fff" stroke-opacity="0.2"
                          stroke-width="1.5"/>
                </g>
                <rect x="92" y="306" width="216" height="10" rx="3" fill="#fbfaf6"/>
                <line x1="94" x2="306" y1="309.3" y2="309.3" stroke="#000" stroke-opacity="0.1" stroke-width="1.2"/>
                <line x1="94" x2="306" y1="312.6" y2="312.6" stroke="#000" stroke-opacity="0.1" stroke-width="1.2"/>
                <rect x="100" y="252" width="10" height="52" fill="#e05e27" opacity="0.6"/>
            </g>
            <g>
                <rect x="118" y="136" width="164" height="132" rx="22" fill="#0d1120" opacity="0.2"
                      filter="url(#soft)"/>
                <rect x="112" y="126" width="176" height="132" rx="22" fill="#24272a"/>
                <rect x="112" y="112" width="176" height="132" rx="22" fill="#34373c"/>
                <rect x="112" y="112" width="176" height="132" rx="22" fill="url(#sheen)"/>
                <rect x="113" y="113" width="174" height="130" rx="21" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <g>
                <rect x="128" y="128" width="144" height="82" rx="12" fill="#15161a"/>
                <rect x="129" y="129" width="142" height="80" rx="11" fill="none" stroke="#000" stroke-opacity="0.2"
                      stroke-width="2"/>
            </g>
            <g transform="translate(164 169) scale(1.667)">
                <path d="M-5-7l-6 7 6 7M5-7l6 7-6 7M2-10l-4 20" fill="none" stroke="#2fc79a" stroke-width="2.6"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g>
                <rect x="196" y="150" width="56" height="6" rx="3" fill="#ff6b2c" opacity="0.8"/>
                <rect x="196" y="165" width="40" height="6" rx="3" fill="#ff6b2c" opacity="0.8"/>
                <rect x="196" y="180" width="48" height="6" rx="3" fill="#ff6b2c" opacity="0.8"/>
            </g>
            <g>
                <rect x="130" y="223" width="40" height="14" rx="7" fill="#cacac7"/>
                <rect x="130" y="220" width="40" height="14" rx="7" fill="#f3f3f0"/>
                <rect x="130" y="220" width="40" height="14" rx="7" fill="url(#sheen)"/>
                <rect x="131" y="221" width="38" height="12" rx="6" fill="none" stroke="#fff" stroke-opacity="0.7"
                      stroke-width="1.5"/>
            </g>
            <g>
                <rect x="178" y="223" width="92" height="14" rx="7" fill="#cacac7"/>
                <rect x="178" y="220" width="92" height="14" rx="7" fill="#f3f3f0"/>
                <rect x="178" y="220" width="92" height="14" rx="7" fill="url(#sheen)"/>
                <rect x="179" y="221" width="90" height="12" rx="6" fill="none" stroke="#fff" stroke-opacity="0.7"
                      stroke-width="1.5"/>
            </g>
            <g>
                <circle cx="266" cy="226" r="7" fill="#2fc79a" opacity="0.3" filter="url(#glow)"/>
                <circle cx="266" cy="226" r="3.2" fill="#2fc79a" class="pulse"/>
                <circle cx="265" cy="224.9" r="1.1" fill="#fff" opacity="0.8"/>
            </g>
        </g>
    </g>
</svg>
