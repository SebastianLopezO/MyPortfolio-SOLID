            </g>
            <g>
                <path d="M220 196C270 220 292 250 296 290" fill="none" stroke="#b8667f" stroke-width="12"
                      stroke-linecap="round" stroke-linejoin="round" transform="translate(0 3)"/>
                <path d="M220 196C270 220 292 250 296 290" fill="none" stroke="#ff8db0" stroke-width="9"
                      stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M220 196C270 220 292 250 296 290" fill="none" stroke="#fff" stroke-opacity="0.3"
                      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                      transform="translate(-1.3499999999999999 -1.8)"/>
            </g>
            <g>
                <rect x="146" y="130" width="108" height="112" rx="24" fill="#0d1120" opacity="0.2"
