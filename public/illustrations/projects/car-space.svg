                <rect x="53" y="71" width="294" height="250" rx="25" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <rect x="78" y="88" width="5" height="96" rx="2.5" fill="#fff" opacity="0.8"/>
            <rect x="138" y="88" width="5" height="96" rx="2.5" fill="#fff" opacity="0.8"/>
            <rect x="198" y="88" width="5" height="96" rx="2.5" fill="#fff" opacity="0.8"/>
            <rect x="258" y="88" width="5" height="96" rx="2.5" fill="#fff" opacity="0.8"/>
            <rect x="318" y="88" width="5" height="96" rx="2.5" fill="#fff" opacity="0.8"/>
            <rect x="78" y="210" width="244" height="5" rx="2.5" fill="#fff" opacity="0.3"/>
            <rect x="207" y="94" width="50" height="84" rx="8" fill="#2fc79a" opacity="0.3" stroke="#2fc79a"
