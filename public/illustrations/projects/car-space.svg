            <g transform="translate(91 96)">
                <g>
                    <rect x="0" y="7" width="46" height="82" rx="14" fill="#2940b3"/>
                    <rect x="0" y="0" width="46" height="82" rx="14" fill="#3a5cff"/>
                    <rect x="0" y="0" width="46" height="82" rx="14" fill="url(#sheen)"/>
                    <rect x="1" y="1" width="44" height="80" rx="13" fill="none" stroke="#fff" stroke-opacity="0.2"
