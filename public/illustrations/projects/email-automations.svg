<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="">
    <style>@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out 3
        both}.rise{animation:rise .9s cubic-bezier(.32,.72,0,1)
        both}.sweep{transform-origin:center;transform-box:fill-box;animation:sweep 2.4s cubic-bezier(.3,0,0,1) 1
        both}}@keyframes pulse{50%{opacity:.25}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes
        sweep{from{transform:rotate(-120deg)}}
    </style>
    <defs>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
            <stop offset="1" stop-color="#000" stop-opacity=".07"/>
        </linearGradient>
        <radialGradient id="glass" cx=".32" cy=".28" r=".75">
            <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
            <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>
    <g class="rise">
        <g>
            <g transform="rotate(-14 184 199)">
                <g>
                    <rect x="90" y="147" width="188" height="138" rx="12" fill="#0d1120" opacity="0.2"
                          filter="url(#soft)"/>
                    <rect x="84" y="137" width="200" height="138" rx="12" fill="#d0d0cc"/>
                    <rect x="84" y="130" width="200" height="138" rx="12" fill="#fbfaf6"/>
                    <rect x="84" y="130" width="200" height="138" rx="12" fill="url(#sheen)"/>
                    <rect x="85" y="131" width="198" height="136" rx="11" fill="none" stroke="#fff" stroke-opacity="0.7"
                          stroke-width="1.5"/>
                </g>
                <path d="M94 140L184 205.9L274 140" fill="none" stroke="#d3d2cf" stroke-width="3"
                      stroke-linejoin="round"/>
            </g>
            <g transform="rotate(4 204 185)">
                <g>
                    <rect x="110" y="133" width="188" height="138" rx="12" fill="#0d1120" opacity="0.2"
                          filter="url(#soft)"/>
                    <rect x="104" y="123" width="200" height="138" rx="12" fill="#d4bcc3"/>
                    <rect x="104" y="116" width="200" height="138" rx="12" fill="#ffe3eb"/>
                    <rect x="104" y="116" width="200" height="138" rx="12" fill="url(#sheen)"/>
                    <rect x="105" y="117" width="198" height="136" rx="11" fill="none" stroke="#fff"
                          stroke-opacity="0.7" stroke-width="1.5"/>
                </g>
                <path d="M114 126L204 191.9L294 126" fill="none" stroke="#d6bfc5" stroke-width="3"
                      stroke-linejoin="round"/>
            </g>
            <g transform="rotate(14 216 215)">
                <g>
                    <rect x="122" y="163" width="188" height="138" rx="12" fill="#0d1120" opacity="0.2"
                          filter="url(#soft)"/>
                    <rect x="116" y="153" width="200" height="138" rx="12" fill="#d0d0cc"/>
                    <rect x="116" y="146" width="200" height="138" rx="12" fill="#fbfaf6"/>
                    <rect x="116" y="146" width="200" height="138" rx="12" fill="url(#sheen)"/>
                    <rect x="117" y="147" width="198" height="136" rx="11" fill="none" stroke="#fff"
                          stroke-opacity="0.7" stroke-width="1.5"/>
                </g>
                <path d="M126 156L216 221.9L306 156" fill="none" stroke="#d3d2cf" stroke-width="3"
                      stroke-linejoin="round"/>
                <rect x="278" y="250" width="24" height="20" rx="4" fill="#ff8db0"/>
            </g>
            <g>
                <circle cx="300" cy="130" r="37.6" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <circle cx="300" cy="121" r="40" fill="#24272a"/>
                <circle cx="300" cy="112" r="40" fill="#34373c"/>
                <circle cx="300" cy="112" r="40" fill="url(#sheen)"/>
                <circle cx="300" cy="112" r="39" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
            </g>
            <path d="M300 92V112L314 122" fill="none" stroke="#ff8db0" stroke-width="5" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </g>
    </g>
</svg>
