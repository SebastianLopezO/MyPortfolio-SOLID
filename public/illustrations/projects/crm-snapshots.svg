                <rect x="56" y="116" width="204" height="156" rx="28" fill="#f3f3f0"/>
                <rect x="56" y="116" width="204" height="156" rx="28" fill="url(#sheen)"/>
                <rect x="57" y="117" width="202" height="154" rx="27" fill="none" stroke="#fff" stroke-opacity="0.7"
                      stroke-width="1.5"/>
            </g>
            <g>
                <rect x="84" y="114" width="42" height="26" rx="9" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <rect x="78" y="104" width="54" height="26" rx="9" fill="#24272a"/>
                <rect x="78" y="98" width="54" height="26" rx="9" fill="#34373c"/>
                <rect x="78" y="98" width="54" height="26" rx="9" fill="url(#sheen)"/>
                <rect x="79" y="99" width="52" height="24" rx="8" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <g>
                <rect x="206" y="105" width="34" height="18" rx="9" fill="#b34b1f"/>
                <rect x="206" y="100" width="34" height="18" rx="9" fill="#ff6b2c"/>
                <rect x="206" y="100" width="34" height="18" rx="9" fill="url(#sheen)"/>
                <rect x="207" y="101" width="32" height="16" rx="8" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <g>
                <circle cx="156" cy="196" r="52" fill="#d6d6d3"/>
                <circle cx="156" cy="196" r="46" fill="#15161a"/>
                <circle cx="156" cy="196" r="28.5" fill="#443d6a"/>
                <circle cx="156" cy="196" r="16.6" fill="#15161a"/>
                <circle cx="156" cy="196" r="46" fill="url(#glass)"/>
                <ellipse cx="142.2" cy="180.4" rx="7.4" ry="4.6" fill="#fff" opacity="0.8"/>
