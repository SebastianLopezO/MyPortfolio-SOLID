                <circle cx="232" cy="236" r="2.2" fill="#000" opacity="0.3"/>
                <circle cx="212" cy="246" r="2.2" fill="#000" opacity="0.3"/>
                <circle cx="222" cy="246" r="2.2" fill="#000" opacity="0.3"/>
                <circle cx="232" cy="246" r="2.2" fill="#000" opacity="0.3"/>
            </g>
            <g>
