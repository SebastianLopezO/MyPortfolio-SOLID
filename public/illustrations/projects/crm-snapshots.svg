                         stroke-width="1.5"/>
                <path d="M266 136v21.28a44 15.84 0 0 0 88 0v-21.28z" fill="#8976e0"/>
                <ellipse cx="310" cy="136" rx="44" ry="15.8" fill="#9c86ff"/>
                <ellipse cx="310" cy="136" rx="43" ry="14.8" fill="none" stroke="#fff" stroke-opacity="0.3"
                         stroke-width="1.5"/>
                <g>
                    <circle cx="334.2" cy="157.3" r="7.7" fill="#2fc79a" opacity="0.3" filter="url(#glow)"/>
