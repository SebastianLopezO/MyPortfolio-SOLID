<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="">
    <style>@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out 3
        both}.rise{animation:rise .9s cubic-bezier(.32,.72,0,1)
        both}.sweep{transform-origin:center;transform-box:fill-box;animation:sweep 2.4s cubic-bezier(.3,0,0,1) 1
        both}}@keyframes pulse{50%{opacity:.25}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes
        sweep{from{transform:rotate(-120deg)}}
    </style>
    <defs>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
            <stop offset="1" stop-color="#000" stop-opacity=".07"/>
        </linearGradient>
        <radialGradient id="glass" cx=".32" cy=".28" r=".75">
            <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
            <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>
    <g class="rise">
        <g>
            <g>
                <circle cx="200" cy="221" r="122.2" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <circle cx="200" cy="212" r="130" fill="#24272a"/>
                <circle cx="200" cy="196" r="130" fill="#34373c"/>
                <circle cx="200" cy="196" r="130" fill="url(#sheen)"/>
                <circle cx="200" cy="196" r="129" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
            </g>
            <circle cx="200" cy="196" r="108" fill="#15161a"/>
            <circle cx="200" cy="196" r="36" fill="none" stroke="#2fc79a" stroke-opacity="0.3" stroke-width="2"/>
            <circle cx="200" cy="196" r="72" fill="none" stroke="#2fc79a" stroke-opacity="0.3" stroke-width="2"/>
            <circle cx="200" cy="196" r="106" fill="none" stroke="#2fc79a" stroke-opacity="0.3" stroke-width="2"/>
            <path d="M92 196H308M200 88V304" stroke="#2fc79a" stroke-opacity="0.2" stroke-width="2"/>
            <g class="sweep">
                <path d="M200 196L200 90A106 106 0 0 1 292 143Z" fill="#2fc79a" opacity="0.3"/>
            </g>
            <circle cx="230" cy="140" r="4" fill="#2fc79a" opacity="0.9"/>
            <circle cx="250" cy="170" r="2.5" fill="#2fc79a" opacity="0.6"/>
            <circle cx="158" cy="230" r="2.5" fill="#2fc79a" opacity="0.9"/>
            <circle cx="176" cy="150" r="4" fill="#2fc79a" opacity="0.6"/>
            <circle cx="266" cy="236" r="2.5" fill="#2fc79a" opacity="0.9"/>
            <circle cx="140" cy="176" r="2.5" fill="#2fc79a" opacity="0.6"/>
            <circle cx="214" cy="262" r="4" fill="#2fc79a" opacity="0.9"/>
            <circle cx="244" cy="120" r="2.5" fill="#2fc79a" opacity="0.6"/>
            <g>
                <circle cx="200" cy="198" r="7" fill="#27a580"/>
                <circle cx="200" cy="196" r="7" fill="#2fc79a"/>
                <circle cx="200" cy="196" r="7" fill="url(#sheen)"/>
                <circle cx="200" cy="196" r="6" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
            </g>
        </g>
    </g>
</svg>
