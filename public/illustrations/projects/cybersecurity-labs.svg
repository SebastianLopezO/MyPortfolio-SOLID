<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="">
    <style>@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out 3
        both}.rise{animation:rise .9s cubic-bezier(.32,.72,0,1)
        both}.sweep{transform-origin:center;transform-box:fill-box;animation:sweep 2.4s cubic-bezier(.3,0,0,1) 1
        both}}@keyframes pulse{50%{opacity:.25}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes
        sweep{from{transform:rotate(-120deg)}}
    </style>
    <defs>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
            <stop offset="1" stop-color="#000" stop-opacity=".07"/>
        </linearGradient>
        <radialGradient id="glass" cx=".32" cy=".28" r=".75">
            <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
            <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>
    <g class="rise">
        <g>
            <path d="M156 190V146a44 44 0 0 1 88 0v44" fill="none" stroke="#c2c2c0" stroke-width="26"
                  stroke-linecap="round" transform="translate(0 4)"/>
            <path d="M156 190V146a44 44 0 0 1 88 0v44" fill="none" stroke="#f3f3f0" stroke-width="22"
                  stroke-linecap="round"/>
            <g>
                <rect x="128" y="200" width="144" height="142" rx="26" fill="#0d1120" opacity="0.2"
                      filter="url(#soft)"/>
                <rect x="122" y="190" width="156" height="142" rx="26" fill="#24272a"/>
                <rect x="122" y="176" width="156" height="142" rx="26" fill="#34373c"/>
                <rect x="122" y="176" width="156" height="142" rx="26" fill="url(#sheen)"/>
                <rect x="123" y="177" width="154" height="140" rx="25" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <circle cx="200" cy="232" r="13" fill="#15161a"/>
            <rect x="194" y="236" width="12" height="34" rx="6" fill="#15161a"/>
            <g>
                <circle cx="200" cy="296" r="8.8" fill="#2fc79a" opacity="0.3" filter="url(#glow)"/>
                <circle cx="200" cy="296" r="4" fill="#2fc79a" class="pulse"/>
                <circle cx="198.8" cy="294.6" r="1.4" fill="#fff" opacity="0.8"/>
            </g>
            <g transform="rotate(-10 75 282)">
                <rect x="46" y="255" width="58" height="92" rx="14" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <rect x="40" y="245" width="70" height="92" rx="14" fill="#cacac7"/>
                <rect x="40" y="236" width="70" height="92" rx="14" fill="#f3f3f0"/>
                <rect x="40" y="236" width="70" height="92" rx="14" fill="url(#sheen)"/>
                <rect x="41" y="237" width="68" height="90" rx="13" fill="none" stroke="#fff" stroke-opacity="0.7"
                      stroke-width="1.5"/>
            </g>
            <circle cx="60" cy="262" r="6" fill="#34373c" opacity="0.6" transform="rotate(-10 75 282)"/>
            <circle cx="88" cy="262" r="6" fill="#34373c" opacity="0.6" transform="rotate(-10 75 282)"/>
            <circle cx="60" cy="284" r="6" fill="#34373c" opacity="0.6" transform="rotate(-10 75 282)"/>
            <circle cx="88" cy="284" r="6" fill="#34373c" opacity="0.6" transform="rotate(-10 75 282)"/>
            <circle cx="60" cy="306" r="6" fill="#34373c" opacity="0.6" transform="rotate(-10 75 282)"/>
            <circle cx="88" cy="306" r="6" fill="#34373c" opacity="0.6" transform="rotate(-10 75 282)"/>
        </g>
    </g>
</svg>
