                <path d="M150 214l-36 44v28l36-16z" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
            </g>
            <g>
                <path d="M250 214l36 44v28l-36-16z" fill="#0d1120" opacity="0.2" filter="url(#soft)"
                      transform="translate(6 18)"/>
