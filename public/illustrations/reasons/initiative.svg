                <circle cx="332" cy="108" r="8.8" fill="#ffcd45" opacity="0.3" filter="url(#glow)"/>
                <circle cx="332" cy="108" r="4" fill="#ffcd45" class="pulse"/>
                <circle cx="330.8" cy="106.6" r="1.4" fill="#fff" opacity="0.8"/>
            </g>
        </g>
    </g>
</svg>
