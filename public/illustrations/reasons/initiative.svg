                    <circle cx="312" cy="215" r="36" fill="#2940b3"/>
                    <circle cx="312" cy="206" r="36" fill="#3a5cff"/>
                    <circle cx="312" cy="206" r="36" fill="url(#sheen)"/>
                    <circle cx="312" cy="206" r="35" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
                </g>
                <path d="M279.6 198.8C301.2 220.4 322.8 220.4 344.4 198.8" fill="none" stroke="#fff"
                      stroke-opacity="0.6" stroke-width="3"/>
            </g>
            <g>
                <g>
                    <circle cx="240" cy="314" r="32" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                    <circle cx="240" cy="305" r="34" fill="#27a580"/>
                    <circle cx="240" cy="296" r="34" fill="#2fc79a"/>
                    <circle cx="240" cy="296" r="34" fill="url(#sheen)"/>
                    <circle cx="240" cy="296" r="33" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
