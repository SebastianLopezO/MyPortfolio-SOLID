                <circle cx="64" cy="286" r="22" fill="#cacac7"/>
                <circle cx="64" cy="280" r="22" fill="#f3f3f0"/>
                <circle cx="64" cy="280" r="22" fill="url(#sheen)"/>
                <circle cx="64" cy="280" r="21" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
            </g>
            <path d="M178 210Q207 137 236 112" fill="none" stroke="#15161a" stroke-opacity="0.3" stroke-width="4"
                  stroke-dasharray="2 12" stroke-linecap="round"/>
            <path d="M178 210Q245 184 312 206" fill="none" stroke="#15161a" stroke-opacity="0.3" stroke-width="4"
                  stroke-dasharray="2 12" stroke-linecap="round"/>
            <path d="M178 210Q209 229 240 296" fill="none" stroke="#15161a" stroke-opacity="0.3" stroke-width="4"
                  stroke-dasharray="2 12" stroke-linecap="round"/>
            <g>
                <circle cx="178" cy="228" r="15" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <circle cx="178" cy="219" r="16" fill="#24272a"/>
                <circle cx="178" cy="214" r="16" fill="#34373c"/>
                <circle cx="178" cy="214" r="16" fill="url(#sheen)"/>
                <circle cx="178" cy="214" r="15" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
            </g>
            <g>
                <g>
                    <circle cx="236" cy="130" r="37.6" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                    <circle cx="236" cy="121" r="40" fill="#b34b1f"/>
                    <circle cx="236" cy="112" r="40" fill="#ff6b2c"/>
                    <circle cx="236" cy="112" r="40" fill="url(#sheen)"/>
                    <circle cx="236" cy="112" r="39" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
                </g>
                <path d="M200 104C224 128 248 128 272 104" fill="none" stroke="#fff" stroke-opacity="0.6"
                      stroke-width="3"/>
            </g>
            <g>
