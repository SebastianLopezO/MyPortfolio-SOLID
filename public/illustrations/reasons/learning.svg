<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="">
    <style>@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out 3
        both}.rise{animation:rise .9s cubic-bezier(.32,.72,0,1)
        both}.sweep{transform-origin:center;transform-box:fill-box;animation:sweep 2.4s cubic-bezier(.3,0,0,1) 1
        both}}@keyframes pulse{50%{opacity:.25}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes
        sweep{from{transform:rotate(-120deg)}}
    </style>
    <defs>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
            <stop offset="1" stop-color="#000" stop-opacity=".07"/>
        </linearGradient>
        <radialGradient id="glass" cx=".32" cy=".28" r=".75">
            <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
            <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>
    <g class="rise">
        <g>
            <ellipse cx="200" cy="316" rx="140" ry="16" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
            <path d="M200 312c-34-16-80-18-128-8V200c48-10 94-8 128 8 34-16 80-18 128-8v104c-48-10-94-8-128 8z"
                  fill="#2e4acc"/>
            <path d="M200 296c-30-14-72-16-114-8v-96c42-8 84-6 114 8z" fill="#fbfaf6"/>
            <path d="M200 296c30-14 72-16 114-8v-96c-42-8-84-6-114 8z" fill="#f1f0ec"/>
            <path d="M200 200v96" stroke="#000" stroke-opacity="0.1" stroke-width="2"/>
            <path d="M100 214c26-5 54-4 82 4M218 218c28-8 56-9 82-4" fill="none" stroke="#000" stroke-opacity="0.1"
                  stroke-width="4" stroke-linecap="round"/>
            <path d="M100 232c26-5 54-4 82 4M218 236c28-8 56-9 82-4" fill="none" stroke="#000" stroke-opacity="0.1"
                  stroke-width="4" stroke-linecap="round"/>
            <path d="M100 250c26-5 54-4 82 4M218 254c28-8 56-9 82-4" fill="none" stroke="#000" stroke-opacity="0.1"
                  stroke-width="4" stroke-linecap="round"/>
            <path d="M100 268c26-5 54-4 82 4M218 272c28-8 56-9 82-4" fill="none" stroke="#000" stroke-opacity="0.1"
                  stroke-width="4" stroke-linecap="round"/>
            <circle cx="200" cy="112" r="52" fill="#ffcd45" opacity="0.3" filter="url(#glow)"/>
            <g>
                <circle cx="200" cy="121" r="35.7" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <circle cx="200" cy="112" r="38" fill="#ffcd45"/>
                <circle cx="200" cy="112" r="38" fill="url(#sheen)"/>
                <circle cx="200" cy="112" r="37" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
            </g>
            <circle cx="200" cy="112" r="38" fill="url(#glass)"/>
            <g>
                <rect x="184" y="152" width="32" height="24" rx="6" fill="#24272a"/>
                <rect x="184" y="146" width="32" height="24" rx="6" fill="#34373c"/>
                <rect x="184" y="146" width="32" height="24" rx="6" fill="url(#sheen)"/>
                <rect x="185" y="147" width="30" height="22" rx="5" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <line x1="151.6" y1="112" x2="138" y2="112" stroke="#ff6b2c" stroke-width="5" stroke-linecap="round"/>
            <line x1="248.4" y1="112" x2="262" y2="112" stroke="#ff6b2c" stroke-width="5" stroke-linecap="round"/>
            <line x1="164.1" y1="77.7" x2="154" y2="68" stroke="#ff6b2c" stroke-width="5" stroke-linecap="round"/>
            <line x1="235.9" y1="77.7" x2="246" y2="68" stroke="#ff6b2c" stroke-width="5" stroke-linecap="round"/>
            <line x1="200" y1="62.1" x2="200" y2="48" stroke="#ff6b2c" stroke-width="5" stroke-linecap="round"/>
        </g>
    </g>
