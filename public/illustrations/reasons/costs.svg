<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="">
    <style>@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out 3
        both}.rise{animation:rise .9s cubic-bezier(.32,.72,0,1)
        both}.sweep{transform-origin:center;transform-box:fill-box;animation:sweep 2.4s cubic-bezier(.3,0,0,1) 1
        both}}@keyframes pulse{50%{opacity:.25}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes
        sweep{from{transform:rotate(-120deg)}}
    </style>
    <defs>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
            <stop offset="1" stop-color="#000" stop-opacity=".07"/>
        </linearGradient>
        <radialGradient id="glass" cx=".32" cy=".28" r=".75">
            <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
            <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>
    <g class="rise">
        <g>
            <g>
                <rect x="190" y="74" width="20" height="26" rx="7" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <rect x="184" y="64" width="32" height="26" rx="7" fill="#24272a"/>
                <rect x="184" y="58" width="32" height="26" rx="7" fill="#34373c"/>
                <rect x="184" y="58" width="32" height="26" rx="7" fill="url(#sheen)"/>
                <rect x="185" y="59" width="30" height="24" rx="6" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <g transform="rotate(40 281 99)">
                <rect x="276" y="99" width="10" height="30" rx="6" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <rect x="270" y="89" width="22" height="30" rx="6" fill="#24272a"/>
                <rect x="270" y="84" width="22" height="30" rx="6" fill="#34373c"/>
                <rect x="270" y="84" width="22" height="30" rx="6" fill="url(#sheen)"/>
                <rect x="271" y="85" width="20" height="28" rx="5" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <g>
                <circle cx="200" cy="239" r="110.9" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <circle cx="200" cy="230" r="118" fill="#cacac7"/>
                <circle cx="200" cy="214" r="118" fill="#f3f3f0"/>
                <circle cx="200" cy="214" r="118" fill="url(#sheen)"/>
                <circle cx="200" cy="214" r="117" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
            </g>
            <circle cx="200" cy="214" r="98" fill="#fbfaf6"/>
            <circle cx="200" cy="214" r="74" fill="none" stroke="#2fc79a" stroke-width="24" opacity="0.5"
                    stroke-dasharray="148.8 999" transform="rotate(-90 200 214)"/>
            <line x1="284" y1="214" x2="292" y2="214" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="272.7" y1="256" x2="279.7" y2="260" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="242" y1="286.7" x2="246" y2="293.7" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
