            <line x1="200" y1="298" x2="200" y2="306" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="158" y1="286.7" x2="154" y2="293.7" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="127.3" y1="256" x2="120.3" y2="260" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="116" y1="214" x2="108" y2="214" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="127.3" y1="172" x2="120.3" y2="168" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="158" y1="141.3" x2="154" y2="134.3" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="200" y1="130" x2="200" y2="122" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="242" y1="141.3" x2="246" y2="134.3" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <line x1="272.7" y1="172" x2="279.7" y2="168" stroke="#15161a" stroke-opacity="0.5" stroke-width="3"
                  stroke-linecap="round"/>
            <g class="sweep">
                <line x1="200" y1="214" x2="254" y2="168" stroke="#ff6b2c" stroke-width="6" stroke-linecap="round"/>
            </g>
            <g>
                <circle cx="200" cy="217" r="11" fill="#24272a"/>
                <circle cx="200" cy="214" r="11" fill="#34373c"/>
                <circle cx="200" cy="214" r="11" fill="url(#sheen)"/>
                <circle cx="200" cy="214" r="10" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5"/>
            </g>
        </g>
    </g>
</svg>
