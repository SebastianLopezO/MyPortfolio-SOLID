<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="">
    <style>@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out 3
        both}.rise{animation:rise .9s cubic-bezier(.32,.72,0,1)
        both}.sweep{transform-origin:center;transform-box:fill-box;animation:sweep 2.4s cubic-bezier(.3,0,0,1) 1
        both}}@keyframes pulse{50%{opacity:.25}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes
        sweep{from{transform:rotate(-120deg)}}
    </style>
    <defs>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
            <stop offset="1" stop-color="#000" stop-opacity=".07"/>
        </linearGradient>
        <radialGradient id="glass" cx=".32" cy=".28" r=".75">
            <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
            <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>
    <g class="rise">
        <g>
            <g>
                <rect x="54" y="196" width="292" height="76" rx="20" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
                <rect x="48" y="186" width="304" height="76" rx="20" fill="#d4aa39"/>
                <rect x="48" y="170" width="304" height="76" rx="20" fill="#ffcd45"/>
                <rect x="48" y="170" width="304" height="76" rx="20" fill="url(#sheen)"/>
                <rect x="49" y="171" width="302" height="74" rx="19" fill="none" stroke="#fff" stroke-opacity="0.7"
                      stroke-width="1.5"/>
            </g>
            <g>
                <rect x="60" y="189" width="26" height="48" rx="13" fill="#24272a"/>
                <rect x="60" y="184" width="26" height="48" rx="13" fill="#34373c"/>
                <rect x="60" y="184" width="26" height="48" rx="13" fill="url(#sheen)"/>
                <rect x="61" y="185" width="24" height="46" rx="12" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <g>
                <rect x="314" y="189" width="26" height="48" rx="13" fill="#24272a"/>
                <rect x="314" y="184" width="26" height="48" rx="13" fill="#34373c"/>
                <rect x="314" y="184" width="26" height="48" rx="13" fill="url(#sheen)"/>
                <rect x="315" y="185" width="24" height="46" rx="12" fill="none" stroke="#fff" stroke-opacity="0.2"
                      stroke-width="1.5"/>
            </g>
            <g>
                <rect x="146" y="186" width="108" height="44" rx="22" fill="#6dd8b8"/>
                <rect x="147" y="187" width="106" height="42" rx="21" fill="none" stroke="#000" stroke-opacity="0.2"
                      stroke-width="2"/>
            </g>
            <line x1="184" x2="184" y1="190" y2="226" stroke="#15161a" stroke-opacity="0.5" stroke-width="2.5"/>
            <line x1="216" x2="216" y1="190" y2="226" stroke="#15161a" stroke-opacity="0.5" stroke-width="2.5"/>
            <ellipse cx="200" cy="206" rx="15" ry="11" fill="#fff" opacity="0.9"/>
            <g>
                <circle cx="112" cy="208" r="5" fill="#dcdbd5" stroke="#b8b6ae" stroke-width="1"/>
                <line x1="109.1" y1="206" x2="114.9" y2="210" stroke="#8f8d86" stroke-width="1.6"
                      stroke-linecap="round"/>
            </g>
            <g>
                <circle cx="288" cy="208" r="5" fill="#dcdbd5" stroke="#b8b6ae" stroke-width="1"/>
                <line x1="285.1" y1="206" x2="290.9" y2="210" stroke="#8f8d86" stroke-width="1.6"
                      stroke-linecap="round"/>
            </g>
            <path d="M80 300h240" stroke="#15161a" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round"
                  stroke-dasharray="2 12"/>
        </g>
    </g>
</svg>
