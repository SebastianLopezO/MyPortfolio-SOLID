<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="">
    <style>@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out 3
        both}.rise{animation:rise .9s cubic-bezier(.32,.72,0,1)
        both}.sweep{transform-origin:center;transform-box:fill-box;animation:sweep 2.4s cubic-bezier(.3,0,0,1) 1
        both}}@keyframes pulse{50%{opacity:.25}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes
        sweep{from{transform:rotate(-120deg)}}
    </style>
    <defs>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
            <stop offset="1" stop-color="#000" stop-opacity=".07"/>
        </linearGradient>
        <radialGradient id="glass" cx=".32" cy=".28" r=".75">
            <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
            <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>
    <g class="rise">
        <g>
            <ellipse cx="200" cy="318" rx="104" ry="26" fill="#0d1120" opacity="0.2" filter="url(#soft)"/>
            <path d="M100 242v52a100 34 0 0 0 200 0v-52z" fill="#6376d1"/>
            <ellipse cx="200" cy="242" rx="100" ry="34" fill="#7990ff"/>
            <ellipse cx="200" cy="242" rx="99" ry="33" fill="none" stroke="#fff" stroke-opacity="0.4"
                     stroke-width="1.5"/>
            <g>
                <circle cx="262" cy="288" r="8.8" fill="#ffcd45" opacity="0.3" filter="url(#glow)"/>
                <circle cx="262" cy="288" r="4" fill="#ffcd45"/>
                <circle cx="260.8" cy="286.6" r="1.4" fill="#fff" opacity="0.8"/>
            </g>
            <path d="M100 180v52a100 34 0 0 0 200 0v-52z" fill="#4c63d1"/>
            <ellipse cx="200" cy="180" rx="100" ry="34" fill="#5d79ff"/>
            <ellipse cx="200" cy="180" rx="99" ry="33" fill="none" stroke="#fff" stroke-opacity="0.4"
                     stroke-width="1.5"/>
            <g>
                <circle cx="262" cy="226" r="8.8" fill="#ffcd45" opacity="0.3" filter="url(#glow)"/>
                <circle cx="262" cy="226" r="4" fill="#ffcd45"/>
                <circle cx="260.8" cy="224.6" r="1.4" fill="#fff" opacity="0.8"/>
            </g>
            <path d="M100 118v52a100 34 0 0 0 200 0v-52z" fill="#304bd1"/>
            <ellipse cx="200" cy="118" rx="100" ry="34" fill="#3a5cff"/>
            <ellipse cx="200" cy="118" rx="99" ry="33" fill="none" stroke="#fff" stroke-opacity="0.4"
                     stroke-width="1.5"/>
            <g>
                <circle cx="262" cy="164" r="8.8" fill="#2fc79a" opacity="0.3" filter="url(#glow)"/>
                <circle cx="262" cy="164" r="4" fill="#2fc79a" class="pulse"/>
                <circle cx="260.8" cy="162.6" r="1.4" fill="#fff" opacity="0.8"/>
            </g>
        </g>
    </g>
</svg>
