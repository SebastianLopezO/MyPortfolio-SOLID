            <rect x="98" y="212" width="62" height="56" rx="10" fill="#9dd4ff"/>
            <rect x="169" y="212" width="62" height="56" rx="10" fill="#82ddc2"/>
            <rect x="240" y="212" width="62" height="56" rx="10" fill="#ffe18f"/>
