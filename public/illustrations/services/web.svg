                <rect x="64" y="82" width="272" height="220" rx="24" fill="#f3f3f0"/>
                <rect x="64" y="82" width="272" height="220" rx="24" fill="url(#sheen)"/>
                <rect x="65" y="83" width="270" height="218" rx="23" fill="none" stroke="#fff" stroke-opacity="0.7"
                      stroke-width="1.5"/>
            </g>
            <g>
                <circle cx="92" cy="106" r="9.9" fill="#ff5148" opacity="0.3" filter="url(#glow)"/>
                <circle cx="92" cy="106" r="4.5" fill="#ff5148"/>
                <circle cx="90.7" cy="104.4" r="1.6" fill="#fff" opacity="0.8"/>
            </g>
            <g>
                <circle cx="112" cy="106" r="9.9" fill="#ffcd45" opacity="0.3" filter="url(#glow)"/>
                <circle cx="112" cy="106" r="4.5" fill="#ffcd45"/>
                <circle cx="110.7" cy="104.4" r="1.6" fill="#fff" opacity="0.8"/>
            </g>
            <g>
                <circle cx="132" cy="106" r="9.9" fill="#2fc79a" opacity="0.3" filter="url(#glow)"/>
                <circle cx="132" cy="106" r="4.5" fill="#2fc79a"/>
                <circle cx="130.7" cy="104.4" r="1.6" fill="#fff" opacity="0.8"/>
            </g>
            <g>
                <rect x="150" y="96" width="164" height="20" rx="10" fill="#e0e0dd"/>
                <rect x="151" y="97" width="162" height="18" rx="9" fill="none" stroke="#000" stroke-opacity="0.2"
                      stroke-width="2"/>
            </g>
            <g>
                <rect x="84" y="128" width="232" height="154" rx="12" fill="#fbfaf6"/>
                <rect x="85" y="129" width="230" height="152" rx="11" fill="none" stroke="#000" stroke-opacity="0.2"
                      stroke-width="2"/>
            </g>
            <rect x="98" y="142" width="204" height="58" rx="10" fill="#c4b6ff"/>
            <g>
