map $http_accept_language $preferred_lang {
    default en;
    ~*^es   es;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # The build writes a .br and a .gz next to every text file: Brotli for the browsers that ask for it (about a quarter
    # smaller on the pages), gzip for the rest.
    brotli_static on;
    gzip_static on;
    gzip on;
    gzip_vary on;
    # The host's reverse proxy talks HTTP/1.0 to this container unless it sets proxy_http_version, and nginx only
    # compresses for HTTP/1.1 by default: without these two lines the scripts reach visitors uncompressed.
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;

    # Responses that leave from this level or from a location without add_header of its own (the 405, /health, the
    # trailing-slash 301) take the security headers from here. The locations that set Cache-Control include them again,
    # because a level that adds a header does not inherit the ones above it.
    include /etc/nginx/snippets/security-headers.conf;

    # A static site takes no request bodies and answers only GET and HEAD; short timeouts free slow connections.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Language" always;
        return 302 /$preferred_lang$is_args$args;
    }

    location ~ ^(?<trimmed>/.+?)/+$ {
        return 301 $trimmed$is_args$args;
    }

    # Renamed project pages keep answering at their old address.
    location ~ ^/(?<page_lang>en|es)/projects/results-email$ {
        include /etc/nginx/snippets/security-headers.conf;
        return 301 /$page_lang/projects/email-automations$is_args$args;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:pdf|jpe?g|png|webp|avif|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~ ^/(?:robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # The pages are files: the role view (?from=) and the lock (?locked=) change nothing in them, so a page
        # prefetched without them serves the visit that carries them (lib/role-links.ts adds ?from= on the click).
        add_header No-Vary-Search 'params=("from" "locked")' always;
        try_files $uri $uri/index.html =404;
    }
}
