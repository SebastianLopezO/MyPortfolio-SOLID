<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="#0d0d0d" name="theme-color">
    <meta content="dark" name="color-scheme">
    <meta content="index, follow, max-image-preview:large" name="robots">
    <meta content="Sebastián López Osorno" name="author">
    <link href="/favicon.ico" rel="icon" sizes="any">
    <link href="/icon.svg" rel="icon" type="image/svg+xml">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <script>try {
        if (new URLSearchParams(location.search).get("locked") === "true") document.documentElement.dataset.locked = "true"
    } catch (e) {
    }</script>
    <!-- Without JavaScript the decision tabs cannot switch: both sides of every decision show, each under its label. -->
    <noscript>
        <style>[data-decision-panel].hidden {
            display: block !important
        }

        [data-decision-tabs] {
            display: none !important
        }

        [data-decision-panel]::before {
            content: attr(data-label);
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
            color: var(--color-fg)
        }</style>
    </noscript>
    <!--app-head-->
</head>
<body>
<div id="root"><!--app-html--></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
