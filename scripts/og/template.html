<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @font-face {
            font-family: "DM Serif Text";
            src: url("{{fonts}}/@fontsource/dm-serif-text/files/dm-serif-text-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 400;
            src: url("{{fonts}}/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 600;
            src: url("{{fonts}}/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2");
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: "IBM Plex Sans", sans-serif;
            color: #f1f6f7;
            background: radial-gradient(700px 420px at 92% 0%, rgba(53, 191, 177, 0.28), transparent 60%),
            radial-gradient(520px 360px at 0% 100%, rgba(97, 215, 178, 0.14), transparent 60%),
            #0d0d0d;
            display: grid;
            grid-template-columns: 1fr 340px;
            align-items: center;
            gap: 56px;
            padding: 72px 80px;
        }

        .eyebrow {
            font-size: 22px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #35bfb1;
            font-weight: 600;
        }

        h1 {
            margin-top: 20px;
            font-family: "DM Serif Text", serif;
            font-weight: 400;
            font-size: 76px;
            line-height: 1.02;
        }

        h2 {
            margin-top: 18px;
            font-family: "DM Serif Text", serif;
            font-weight: 400;
            font-size: 40px;
            line-height: 1.15;
            background: linear-gradient(120deg, #35bfb1, #61d7b2);
            -webkit-background-clip: text;
            color: transparent;
        }

        p {
            margin-top: 26px;
            font-size: 26px;
            color: #a4b5b3;
        }

        .footer {
            margin-top: 34px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 22px;
            color: #f1f6f7;
        }

        .chip {
            border: 2px solid #233937;
            border-radius: 999px;
            padding: 6px 18px;
            white-space: nowrap;
        }

        .case h1 {
            font-size: 58px;
            line-height: 1.06;
        }

        .case h2 {
            font-size: 34px;
        }

        .case p {
            margin-top: 22px;
            font-size: 24px;
            line-height: 1.35;
        }

        /* A certification shows its certificate where the other cards show the photo. */
        .certificate {
            grid-template-columns: 1fr 470px;
        }

        .certificate h1 {
            font-size: 46px;
        }

        .sheet {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 486px;
        }

        .sheet img {
            max-width: 100%;
            max-height: 100%;
            border: 2px solid #233937;
            border-radius: 10px;
        }

        .photo {
            width: 340px;
            aspect-ratio: 1;
            padding: 8px;
            background: linear-gradient(135deg, #35bfb1, #018d71);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
    </style>
</head>
<body class="{{bodyClass}}">
<div>
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{heading}}</h1>
    <h2>{{subheading}}</h2>
    <p>{{tagline}}</p>
    <div class="footer">
        <span class="chip">sebastianlopezo.page</span>
        <span class="chip">{{location}}</span>
    </div>
</div>
{{aside}}
</body>
</html>
