<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @font-face {
            font-family: "DM Serif Text";
            font-weight: 400;
            src: url("{{fonts}}/@fontsource/dm-serif-text/files/dm-serif-text-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 400;
            src: url("{{fonts}}/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 600;
            src: url("{{fonts}}/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2");
        }

        @font-face {
            font-family: "Source Code Pro";
            font-weight: 400;
            src: url("{{fonts}}/@fontsource/source-code-pro/files/source-code-pro-latin-400-normal.woff2") format("woff2");
        }

        :root {
            --bg: #fbfcfd;
            --surface: #f2f4f5;
            --surface-raised: #e7eaec;
            --border: #dcdee0;
            --fg: #141619;
            --fg-muted: #3d4044;
            --fg-subtle: #484a4f;
            --accent: #1745c2;
            --success: #227a4b;
            --tile-sky: oklch(0.93 0.035 240);
            --tile-mint: oklch(0.93 0.04 170);
            --tile-peach: oklch(0.93 0.04 55);
            --tile-lilac: oklch(0.93 0.035 300);
            --tile-butter: oklch(0.95 0.05 95);
            --tile-rose: oklch(0.93 0.035 10);
            --tile-sage: oklch(0.93 0.03 135);
            --tile-stone: oklch(0.935 0.006 250);
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            position: relative;
            isolation: isolate;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: "IBM Plex Sans", sans-serif;
            color: var(--fg);
            background-color: var(--bg);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 460px;
            align-items: stretch;
            gap: 56px;
            padding: 64px 72px;
        }

        /* The technical field from the hero: fine hairlines with every fourth line stronger, fading toward the edges. */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(20, 22, 25, 0.085) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20, 22, 25, 0.085) 1px, transparent 1px),
                linear-gradient(rgba(20, 22, 25, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20, 22, 25, 0.045) 1px, transparent 1px);
            background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px;
            background-position: -1px -1px;
            mask-image: radial-gradient(75% 70% at 38% 45%, black 0%, transparent 90%);
        }

        .copy {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            padding-block: 6px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: "Source Code Pro", monospace;
            font-size: 19px;
            color: var(--fg-subtle);
            letter-spacing: -0.01em;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: var(--success);
            flex-shrink: 0;
        }

        .case .dot {
            background: var(--accent);
        }

        h1 {
            margin-top: 22px;
            font-family: "DM Serif Text", serif;
            font-weight: 400;
            font-size: 68px;
            line-height: 1.02;
            color: var(--fg);
            text-wrap: balance;
        }

        h2 {
            margin-top: 14px;
            font-family: "DM Serif Text", serif;
            font-weight: 400;
            font-size: 34px;
            line-height: 1.15;
            color: var(--fg-subtle);
        }

        p {
            margin-top: 22px;
            font-size: 23px;
            line-height: 1.42;
            color: var(--fg-muted);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-wrap: pretty;
        }

        .case h1 {
            font-size: 56px;
            line-height: 1.02;
        }

        .case.long h1 {
            font-size: 46px;
            line-height: 1.05;
        }

        .case.xlong h1 {
            font-size: 40px;
            line-height: 1.08;
        }

        .case h2 {
            font-size: 28px;
        }

        .case p {
            margin-top: 18px;
            font-size: 22px;
        }

        .footer {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            font-family: "Source Code Pro", monospace;
            font-size: 17px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 9px 18px;
            white-space: nowrap;
            line-height: 1;
        }

        .chip-ink {
            background: var(--fg);
            color: var(--bg);
        }

        .chip-fog {
            background: var(--surface-raised);
            border: 1px solid var(--border);
            color: var(--fg);
        }

        .tile {
            position: relative;
            width: 460px;
            height: 460px;
            align-self: center;
            border-radius: 42px;
            display: grid;
            place-items: center;
            overflow: hidden;
            box-shadow:
                inset 0 0 0 1px rgba(20, 22, 25, 0.08),
                0 1px 2px rgba(0, 0, 0, 0.05),
                0 22px 44px -24px rgba(20, 22, 25, 0.24);
        }

        .tile > svg.illustration {
            width: 84%;
            height: 84%;
        }

        .board {
            background: var(--surface-raised);
        }

        .board > svg.board-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .board > img.socket {
            position: absolute;
            object-fit: cover;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="{{bodyClass}}">
<div class="copy">
    <div>
        <div class="eyebrow">
            <span class="dot"></span>
            <span>{{eyebrow}}</span>
        </div>
        <h1>{{heading}}</h1>
        <h2>{{subheading}}</h2>
        <p>{{tagline}}</p>
    </div>
    <div class="footer">
        <span class="chip chip-ink">sebastianlopezo.page</span>
        <span class="chip chip-fog">{{location}}</span>
    </div>
</div>
{{aside}}
</body>
</html>
